<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BaseAR - Galería</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="phone gallery-page">

        <!-- =========================
             ENCABEZADO
        ========================== -->

        <div class="info-header">

            <button
                class="back"
                onclick="location.href='info.html'">
                ‹
            </button>

            <h2>
                🖼️ Galería
            </h2>

        </div>

        <!-- =========================
             CATEGORÍAS
        ========================== -->

        <div class="gallery-categories">

            <button class="category active">Todos</button>
            <button class="category">Partidos</button>
            <button class="category">Jugadores</button>
            <button class="category">Estadio</button>
            <button class="category">Histórico</button>

        </div>

        <!-- =========================
             GALERÍA DE IMÁGENES
        ========================== -->

        <div class="gallery-grid">

            <div class="gallery-item">
                <div class="gallery-image" style="background: linear-gradient(135deg, #2d3436, #636e72);">
                    <span class="gallery-icon">⚾</span>
                </div>
                <div class="gallery-info">
                    <h4>Partido en casa</h4>
                    <p>2026 • Estadio principal</p>
                </div>
            </div>

            <div class="gallery-item">
                <div class="gallery-image" style="background: linear-gradient(135deg, #e17055, #d63031);">
                    <span class="gallery-icon">⭐</span>
                </div>
                <div class="gallery-info">
                    <h4>Jugador estrella</h4>
                    <p>Mike Johnson • LF</p>
                </div>
            </div>

            <div class="gallery-item">
                <div class="gallery-image" style="background: linear-gradient(135deg, #0984e3, #6c5ce7);">
                    <span class="gallery-icon">🏟️</span>
                </div>
                <div class="gallery-info">
                    <h4>Vista del estadio</h4>
                    <p>Capacidad 45,000</p>
                </div>
            </div>

            <div class="gallery-item">
                <div class="gallery-image" style="background: linear-gradient(135deg, #fdcb6e, #e17055);">
                    <span class="gallery-icon">🏆</span>
                </div>
                <div class="gallery-info">
                    <h4>Celebración del título</h4>
                    <p>Serie Mundial 2025</p>
                </div>
            </div>

            <div class="gallery-item">
                <div class="gallery-image" style="background: linear-gradient(135deg, #00b894, #00cec9);">
                    <span class="gallery-icon">📸</span>
                </div>
                <div class="gallery-info">
                    <h4>Momento histórico</h4>
                    <p>Década de 1920</p>
                </div>
            </div>

            <div class="gallery-item">
                <div class="gallery-image" style="background: linear-gradient(135deg, #6c5ce7, #a29bfe);">
                    <span class="gallery-icon">🔥</span>
                </div>
                <div class="gallery-info">
                    <h4>Jugada destacada</h4>
                    <p>2026 • Playoffs</p>
                </div>
            </div>

        </div>

        <!-- =========================
             BOTÓN DE CARGAR MÁS
        ========================== -->

        <button class="load-more">
            Cargar más imágenes
        </button>

    </div>

</body>

</html>
