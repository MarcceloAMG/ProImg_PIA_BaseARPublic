<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BaseAR - Video</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="phone video-page">

        <!-- =========================
             ENCABEZADO
        ========================== -->

        <div class="info-header">

            <button
                class="back"
                onclick="location.href='info.html'">
                ‹
            </button>

            <h2>
                Video
            </h2>

        </div>

        <!-- =========================
             REPRODUCTOR DE VIDEO
        ========================== -->

        <div class="video-player">

            <div class="video-thumbnail">
                <div class="play-button">
                    ▶
                </div>
                <span class="video-duration">3:45</span>
            </div>

            <div class="video-info">
                <h3>Momento destacado del partido</h3>
                <p>New York Baseball vs Los Angeles Stars - 2026</p>
            </div>

            <div class="video-controls">

                <button class="control-btn">⏮</button>
                <button class="control-btn play-pause">⏸</button>
                <button class="control-btn">⏭</button>

                <div class="timeline">
                    <div class="timeline-fill" style="width: 35%;"></div>
                </div>

                <span class="time-display">1:32 / 3:45</span>

            </div>

        </div>

        <!-- =========================
             FILTROS AR
        ========================== -->

        <div class="filters-section">

            <h3>
                🎭 Filtros AR disponibles
            </h3>

            <div class="filters-grid">

                <div class="filter-item">
                    <div class="filter-preview" style="background: #ff6b6b;">
                        <span>⚾</span>
                    </div>
                    <span>Clásico</span>
                </div>

                <div class="filter-item">
                    <div class="filter-preview" style="background: #4ecdc4;">
                        <span>⭐</span>
                    </div>
                    <span>Estrella</span>
                </div>

                <div class="filter-item">
                    <div class="filter-preview" style="background: #45b7d1;">
                        <span>🔥</span>
                    </div>
                    <span>Fuego</span>
                </div>

                <div class="filter-item">
                    <div class="filter-preview" style="background: #f9ca24;">
                        <span>🌈</span>
                    </div>
                    <span>Arcoíris</span>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
