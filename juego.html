<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BaseAR - Estadísticas</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="phone stats-page">

        <!-- =========================
             ENCABEZADO
        ========================== -->

        <div class="info-header">

            <button
                class="back"
                onclick="location.href='info.html'">
                ‹
            </button>

            <h2>
                Estadísticas
            </h2>

        </div>

        <!-- =========================
             RESUMEN DE TEMPORADA
        ========================== -->

        <div class="stats-summary">

            <div class="stat-card">
                <span class="stat-value">89</span>
                <span class="stat-label">Victorias</span>
            </div>

            <div class="stat-card">
                <span class="stat-value">73</span>
                <span class="stat-label">Derrotas</span>
            </div>

            <div class="stat-card">
                <span class="stat-value">.549</span>
                <span class="stat-label">Porcentaje</span>
            </div>

        </div>

        <!-- =========================
             ESTADÍSTICAS DE JUGADORES
        ========================== -->

        <div class="stats-players">

            <h3>📊 Líderes del equipo</h3>

            <div class="player-stat">

                <div class="player-info">
                    <span class="player-name">Mike Johnson</span>
                    <span class="player-pos">LF</span>
                </div>

                <div class="player-numbers">
                    <div class="player-number">
                        <span class="num">.312</span>
                        <span class="num-label">AVG</span>
                    </div>
                    <div class="player-number">
                        <span class="num">28</span>
                        <span class="num-label">HR</span>
                    </div>
                    <div class="player-number">
                        <span class="num">95</span>
                        <span class="num-label">RBI</span>
                    </div>
                </div>

            </div>

            <div class="player-stat">

                <div class="player-info">
                    <span class="player-name">David Rodríguez</span>
                    <span class="player-pos">SS</span>
                </div>

                <div class="player-numbers">
                    <div class="player-number">
                        <span class="num">.298</span>
                        <span class="num-label">AVG</span>
                    </div>
                    <div class="player-number">
                        <span class="num">22</span>
                        <span class="num-label">HR</span>
                    </div>
                    <div class="player-number">
                        <span class="num">78</span>
                        <span class="num-label">RBI</span>
                    </div>
                </div>

            </div>

            <div class="player-stat">

                <div class="player-info">
                    <span class="player-name">Tomás Martínez</span>
                    <span class="player-pos">P</span>
                </div>

                <div class="player-numbers">
                    <div class="player-number">
                        <span class="num">2.89</span>
                        <span class="num-label">ERA</span>
                    </div>
                    <div class="player-number">
                        <span class="num">16</span>
                        <span class="num-label">W</span>
                    </div>
                    <div class="player-number">
                        <span class="num">215</span>
                        <span class="num-label">K</span>
                    </div>
                </div>

            </div>

        </div>

        <!-- =========================
             GRÁFICO SIMULADO
        ========================== -->

        <div class="stats-chart">

            <h3>📈 Rendimiento por mes</h3>

            <div class="chart-bars">

                <div class="chart-bar">
                    <div class="bar" style="height: 40%;"></div>
                    <span>Abr</span>
                </div>

                <div class="chart-bar">
                    <div class="bar" style="height: 60%;"></div>
                    <span>May</span>
                </div>

                <div class="chart-bar">
                    <div class="bar" style="height: 75%;"></div>
                    <span>Jun</span>
                </div>

                <div class="chart-bar">
                    <div class="bar" style="height: 55%;"></div>
                    <span>Jul</span>
                </div>

                <div class="chart-bar">
                    <div class="bar" style="height: 80%;"></div>
                    <span>Ago</span>
                </div>

                <div class="chart-bar">
                    <div class="bar" style="height: 90%;"></div>
                    <span>Sep</span>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
