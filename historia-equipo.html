<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaseAR - Historia del Equipo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="phone team-history-page">
        <div class="info-header">
            <button class="back" id="btnBack">‹</button>
            <h2>🏆 Historia del Equipo</h2>
        </div>

        <div class="team-banner">
            <div class="team-banner-logo" id="bannerLogo">⚾</div>
            <div class="team-banner-info">
                <h3 id="bannerTitle">Cargando...</h3>
                <p id="bannerSub">...</p>
            </div>
        </div>

        <div class="team-history-content" id="historySections">
            <!-- Aquí se inyectará el HTML dinámicamente -->
        </div>

        <div class="team-achievements">
            <h4>🏅 Logros destacados</h4>
            <div class="achievement-grid" id="achievementsGrid">
                <!-- Aquí se inyectarán los logros -->
            </div>
        </div>
    </div>

    <script src="js/teams-data.js"></script>
    <script>
        window.onload = function() {
            if (typeof TEAMS_DATA === 'undefined') return alert("Falta teams-data.js");

            const urlParams = new URLSearchParams(window.location.search);
            const teamId = urlParams.get('team') || 'yankees';
            const data = TEAMS_DATA[teamId];

            // Configurar botón de volver
            document.getElementById('btnBack').onclick = () => location.href = `info.html?team=${teamId}`;

            if (data && data.history) {
                // Actualizar banner
                document.getElementById('bannerLogo').innerText = data.logo || "⚾";
                document.getElementById('bannerTitle').innerText = data.history.bannerTitle || data.name;
                document.getElementById('bannerSub').innerText = data.history.bannerSub || "Historia del equipo";

                // Inyectar secciones de historia
                const sectionsContainer = document.getElementById('historySections');
                sectionsContainer.innerHTML = ""; 
                
                if (data.history.sections && data.history.sections.length > 0) {
                    data.history.sections.forEach(sec => {
                        sectionsContainer.innerHTML += `
                            <div class="history-section">
                                <h4>${sec.title}</h4>
                                <p>${sec.text}</p>
                            </div>
                        `;
                    });
                } else {
                    sectionsContainer.innerHTML = "<p>Historia en construcción...</p>";
                }

                // Inyectar logros
                const grid = document.getElementById('achievementsGrid');
                grid.innerHTML = "";
                if (data.history.achievements) {
                    data.history.achievements.forEach(ach => {
                        grid.innerHTML += `
                            <div class="achievement-item">
                                <span class="achievement-number">${ach.number}</span>
                                <span class="achievement-label">${ach.label}</span>
                            </div>
                        `;
                    });
                }
            }
        };
    </script>
</body>
</html>
