<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaseAR - Estadísticas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="phone stats-page">
        <div class="info-header">
            <button class="back" id="btnBack">‹</button>
            <h2>Estadísticas</h2>
        </div>

        <div class="stats-summary">
            <div class="stat-card"><span class="stat-value" id="statWins">-</span><span class="stat-label">Victorias</span></div>
            <div class="stat-card"><span class="stat-value" id="statLosses">-</span><span class="stat-label">Derrotas</span></div>
            <div class="stat-card"><span class="stat-value" id="statPct">-</span><span class="stat-label">Porcentaje</span></div>
        </div>

        <div class="stats-players">
            <h3>📊 Líderes del equipo</h3>
            <div id="playersContainer">
                <!-- Inyección de jugadores -->
            </div>
        </div>

        <div class="stats-chart">
            <h3>📈 Rendimiento por mes</h3>
            <div class="chart-bars" id="chartContainer">
                <!-- Inyección de barras -->
            </div>
        </div>
    </div>

    <script src="js/teams-data.js"></script>
    <script>
        window.onload = function() {
            if (typeof TEAMS_DATA === 'undefined') return;

            const urlParams = new URLSearchParams(window.location.search);
            const teamId = urlParams.get('team') || 'yankees';
            const data = TEAMS_DATA[teamId];

            document.getElementById('btnBack').onclick = () => location.href = `info.html?team=${teamId}`;

            if (data && data.stats) {
                // Resumen
                document.getElementById('statWins').innerText = data.stats.summary.wins;
                document.getElementById('statLosses').innerText = data.stats.summary.losses;
                document.getElementById('statPct').innerText = data.stats.summary.pct;

                // Jugadores
                const playersContainer = document.getElementById('playersContainer');
                playersContainer.innerHTML = "";
                if (data.stats.players && data.stats.players.length > 0) {
                    data.stats.players.forEach(p => {
                        playersContainer.innerHTML += `
                            <div class="player-stat">
                                <div class="player-info">
                                    <span class="player-name">${p.name}</span>
                                    <span class="player-pos">${p.pos}</span>
                                </div>
                                <div class="player-numbers">
                                    <div class="player-number"><span class="num">${p.stat1}</span><span class="num-label">${p.stat1_lbl}</span></div>
                                    <div class="player-number"><span class="num">${p.stat2}</span><span class="num-label">${p.stat2_lbl}</span></div>
                                    <div class="player-number"><span class="num">${p.stat3}</span><span class="num-label">${p.stat3_lbl}</span></div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    playersContainer.innerHTML = "<p style='font-size:12px;color:#8ca1ba;'>Datos de jugadores no disponibles.</p>";
                }

                // Gráfico
                const chartContainer = document.getElementById('chartContainer');
                chartContainer.innerHTML = "";
                const meses = ["Abr", "May", "Jun", "Jul", "Ago", "Sep"];
                if (data.stats.chart) {
                    data.stats.chart.forEach((val, index) => {
                        chartContainer.innerHTML += `
                            <div class="chart-bar">
                                <div class="bar" style="height: ${val}%;"></div>
                                <span>${meses[index]}</span>
                            </div>
                        `;
                    });
                }
            }
        };
    </script>
</body>
</html>
