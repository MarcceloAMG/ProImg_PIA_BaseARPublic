<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BaseAR - Realidad Aumentada</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- =========================
         THREE.JS + MINDAR (Image Tracking)
         Se cargan como módulos ES vía importmap.
    ========================== -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
    }
    </script>
</head>

<body>

    <div class="phone ar">

        <!-- =========================
             CONTENEDOR DE CÁMARA / AR
             MindAR inyecta aquí el <video> y el <canvas> de Three.js
        ========================== -->

        <div id="ar-container" class="ar-container"></div>


        <!-- =========================
             HEADER
        ========================== -->

        <div class="header">

            <button onclick="location.href='equipos.html'">
                ‹
            </button>

            <div class="title">
                ESCANEAR LOGO
            </div>

            <button onclick="location.href='info.html'">
                ⚡
            </button>

        </div>


        <!-- =========================
             INSTRUCCIONES
        ========================== -->

        <div class="instructions" id="instructions">

            <h2>
                Apunta al logo del equipo
            </h2>

            <p>
                Coloca el logo dentro del encuadre
                para identificarlo
            </p>

        </div>


        <!-- =========================
             ESTADO
        ========================== -->

        <div class="status">

            <span class="dot" id="statusDot"></span>

            <span id="status">
                Iniciando cámara...
            </span>

            <p id="statusHint">
                Concede permiso de cámara para comenzar
            </p>

        </div>


        <!-- =========================
             BOTONES AR (Cámara, Confeti, Pausar)
        ========================== -->

        <div class="ar-buttons show" id="arButtons">

            <button class="ar-btn confetti" id="confettiBtn">
                <span class="ar-icon">🎊</span>
                <span class="ar-label">Confeti</span>
            </button>

            <button class="ar-btn camera" id="cameraBtn">
                <span class="ar-icon">📷</span>
                <span class="ar-label">Foto</span>
            </button>

            <button class="ar-btn pause" id="pauseBtn">
                <span class="ar-icon">⏸️</span>
                <span class="ar-label">Pausar</span>
            </button>

        </div>


        <!-- =========================
             OVERLAY DE PERMISO DE CÁMARA
             Se muestra si el navegador bloquea el acceso o mientras se solicita
        ========================== -->

        <div class="permission-overlay" id="permissionOverlay" style="display:none;">
            <p id="permissionText">
                Necesitamos acceso a tu cámara para
                escanear el logo en realidad aumentada.
            </p>
            <button id="enableCameraBtn">
                Permitir cámara
            </button>
        </div>


        <!-- =========================
             AVISO DE FOTO GUARDADA
        ========================== -->

        <div class="photo-toast" id="photoToast"></div>

    </div>


    <!-- =========================
         JAVASCRIPT (MindAR + Three.js)
    ========================== -->

    <script type="module">

        import * as THREE from "three";
        import { MindARThree } from "mindar-image-three";

        // -------------------------------------------------
        // 1) CONFIGURACIÓN DE MINDAR
        //
        //    imageTargetSrc debe apuntar a un archivo .mind
        //    compilado a partir de la(s) imagen(es) que quieres
        //    reconocer (los logos de los equipos).
        //
        //    Genera ese archivo con el compilador oficial:
        //    https://hiukim.github.io/mind-ar-js-doc/tools/compile
        //
        //    Sube el .mind resultante junto a este archivo y
        //    reemplaza la ruta de abajo (por ejemplo "targets.mind").
        // -------------------------------------------------

        // -------------------------------------------------
        // DIVISIONES
        //
        //    Para que el reconocimiento sea rápido, los 15 logos se
        //    dividieron en 3 archivos .mind de 5 imágenes cada uno.
        //    equipos.html manda a esta página con ?division=este,
        //    ?division=central u ?division=oeste, y aquí se carga
        //    SOLO el .mind (y los modelos) de esa división.
        //
        //    El targetIndex es el orden en que está cada logo dentro
        //    de su archivo .mind. Si recompilas, respeta este orden.
        //
        //    modelPath: ruta del .glb de ese equipo. Si lo dejas sin
        //    poner, se muestra el modelo de respaldo (esfera + nombre).
        // -------------------------------------------------

               const DIVISIONES = {

            este: {
                nombre: "Liga Americana Este",
                mind: "./assets/este.mind",
                equipos: [
                    { targetIndex: 0, nombre: "Orioles", modelPath: "./models/ball_orioles.glb", scale: 1.0 },
                    { targetIndex: 1, nombre: "Red Sox", modelPath: "./models/cap_redsox.glb", scale: 1.0 },
                    { targetIndex: 2, nombre: "Yankees", modelPath: "./models/bate_yankees.glb", scale: 0.40 },
                    { targetIndex: 3, nombre: "Rays", modelPath: "./models/casco_rays.glb", scale: 1.0 },
                    { targetIndex: 4, nombre: "Blue Jays", modelPath: "./models/casco_bluejays.glb", scale: 1.0 }
                ]
            },

            central: {
                nombre: "Liga Americana Central",
                mind: "./assets/central.mind",
                equipos: [
                    { targetIndex: 0, nombre: "White Sox", modelPath: "./models/casco_whitesox.glb", scale: 1.0 },
                    { targetIndex: 1, nombre: "Guardians", modelPath: "./models/bate_guardians.glb", scale: 0.40 },
                    { targetIndex: 2, nombre: "Tigers", modelPath: "./models/cap_tigers.glb", scale: 1.0 },
                    { targetIndex: 3, nombre: "Royals", modelPath: "./models/bate_royals.glb", scale: 0.40 },
                    { targetIndex: 4, nombre: "Twins", modelPath: "./models/cap_twins.glb", scale: 1.0 }
                ]
            },

            oeste: {
                nombre: "Liga Americana Oeste",
                mind: "./assets/oeste.mind",
                equipos: [
                    { targetIndex: 0, nombre: "Astros", modelPath: "./models/foam_astros.glb", scale: 1.0 },
                    { targetIndex: 1, nombre: "Angels", modelPath: "./models/ball_angels.glb", scale: 1.0 },
                    { targetIndex: 2, nombre: "Athletics", modelPath: "./models/foam_athletics.glb", scale: 1.0 },
                    { targetIndex: 3, nombre: "Mariners", modelPath: "./models/foam_mariners.glb", scale: 1.0 },
                    { targetIndex: 4, nombre: "Rangers", modelPath: "./models/ball_rangers.glb", scale: 1.0 }
                ]
            }

        };

        const claveDivision = (
            new URLSearchParams(location.search).get("division") || ""
        ).toLowerCase();

        const division = DIVISIONES[claveDivision];

        if (!division) {
            // Sin división válida no sabemos qué .mind cargar:
            // se regresa a la lista para elegir una.
            location.replace("equipos.html");
            throw new Error("Falta ?division=este|central|oeste en la URL");
        }

        const container = document.querySelector("#ar-container");

        const mindarThree = new MindARThree({
            container: container,
            imageTargetSrc: division.mind, // .mind de la división elegida
            maxTrack: 1,
            uiScanning: false,
            uiLoading: false,

            // Por defecto MindAR espera 5 cuadros seguidos detectando
            // bien el logo antes de "confirmarlo" (para evitar falsos
            // positivos). Bajarlo a 1-2 hace que el modelo aparezca
            // casi de inmediato. Si notas que parpadea o se confirma
            // con cosas que no son tu logo, súbelo un poco (2-3).
            warmupTolerance: 1,

            // Cuadros seguidos sin detectar el logo antes de darlo
            // por "perdido". Más alto = tolera más que tiembles la
            // cámara sin que el modelo desaparezca.
            missTolerance: 5
        });

        const { renderer, scene, camera } = mindarThree;

        // -------------------------------------------------
        // 2) LUCES DE LA ESCENA
        // -------------------------------------------------

        scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.1));

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(0.5, 1, 0.5);
        scene.add(dirLight);

        // -------------------------------------------------
        // 3) MODELO AR QUE SE MUESTRA SOBRE EL LOGO
        //
        //    Por defecto se genera un modelo simple (esfera +
        //    etiqueta de texto) para que veas el flujo funcionando
        //    sin depender de un archivo .glb externo.
        //
        //    Para usar tu propio modelo 3D (.glb/.gltf), importa
        //    GLTFLoader y reemplaza este bloque, por ejemplo:
        //
        //    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
        //    const loader = new GLTFLoader();
        //    loader.load("./models/equipo.glb", (gltf) => {
        //        gltf.scene.scale.set(0.2, 0.2, 0.2);
        //        modelGroup.add(gltf.scene);
        //    });
        //
        //    Cuando compilas tu(s) logo(s) en
        //    https://hiukim.github.io/mind-ar-js-doc/tools/compile
        //    el orden en que subas las imágenes define su índice:
        //    la 1ra imagen = targetIndex 0, la 2da = targetIndex 1, etc.
        //
        //    Aquí defines, por cada targetIndex, qué modelo .glb
        //    cargar (o un modelo simple de respaldo si no pones
        //    ninguna ruta). Agrega o quita objetos de este arreglo
        //    según cuántas imágenes tenga tu targets.mind.
        // -------------------------------------------------

        import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
        const loader = new GLTFLoader();

        // Referencias de la interfaz (se usan dentro de los eventos
        // onTargetFound / onTargetLost de cada anchor, más abajo)
        const statusText = document.getElementById("status");
        const statusHint = document.getElementById("statusHint");
        const statusDot = document.getElementById("statusDot");
        const instructions = document.getElementById("instructions");
        const permissionOverlay = document.getElementById("permissionOverlay");
        const permissionText = document.getElementById("permissionText");

        // Valores por defecto de cada modelo; cada equipo de DIVISIONES
        // puede sobreescribirlos (scale, rotationY, yOffset, rotationSpeed).
        const configuracionTargets = division.equipos.map((equipo) => ({
            scale: 0.15,          // tamaño del modelo
            rotationY: 0,         // gira el modelo si aparece de lado
            yOffset: 0.05,        // súbelo/bájalo sobre el logo
            rotationSpeed: 0.1,  // qué tan rápido gira (radianes por frame)
            ...equipo
        }));

        // Muestra en pantalla qué división se está escaneando
        instructions.querySelector("p").textContent =
            division.nombre + " · coloca el logo dentro del encuadre";

        function crearEtiquetaTexto(texto, color = "#ffffff") {

            const canvas = document.createElement("canvas");
            canvas.width = 512;
            canvas.height = 128;

            const ctx = canvas.getContext("2d");
            ctx.font = "bold 64px Arial";
            ctx.fillStyle = color;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(texto, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;

            const material = new THREE.SpriteMaterial({
                map: texture,
                transparent: true
            });

            const sprite = new THREE.Sprite(material);
            sprite.scale.set(0.6, 0.15, 1);

            return sprite;

        }

        // Modelo simple de respaldo (esfera + etiqueta) por si un
        // target no tiene modelPath, o mientras se sube tu .glb real.
        function crearModeloRespaldo(nombre) {

            const grupo = new THREE.Group();

            const geometria = new THREE.SphereGeometry(0.15, 32, 32);
            const material = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                emissive: 0x1c5aff,
                emissiveIntensity: 0.25,
                roughness: 0.35,
                metalness: 0.1
            });
            const esfera = new THREE.Mesh(geometria, material);
            esfera.position.y = 0.18;
            grupo.add(esfera);

            const etiqueta = crearEtiquetaTexto(nombre.toUpperCase(), "#43a8ff");
            etiqueta.position.y = -0.05;
            grupo.add(etiqueta);

            grupo.userData.animar = (t) => {
                esfera.position.y = 0.18 + Math.sin(t * 2) * 0.03;
            };

            return grupo;

        }

        // Objetos que se animan (flotando) en cada frame
        const objetosAnimados = [];

        // Grupos de cada modelo AR, para poder rotarlos en cada frame
        const gruposModelo = [];

        // Por cada target: crea su anchor y le carga su modelo
        configuracionTargets.forEach((config) => {

            const anchor = mindarThree.addAnchor(config.targetIndex);
            const modelGroup = new THREE.Group();
            modelGroup.userData.rotationSpeed = config.rotationSpeed ?? 0.01;
            anchor.group.add(modelGroup);
            gruposModelo.push(modelGroup);

            if (config.modelPath) {

                loader.load(

                    config.modelPath,

                    (gltf) => {

                        const modelo = gltf.scene;
                        modelo.scale.setScalar(config.scale ?? 0.15);
                        modelo.rotation.y = config.rotationY ?? 0;
                        modelo.position.y = config.yOffset ?? 0.05;
                        modelGroup.add(modelo);

                    },

                    undefined,

                    (error) => {

                        // Si el .glb no carga (ruta incorrecta, archivo
                        // faltante, etc.) se usa el modelo de respaldo
                        // para que igual veas algo sobre el logo.
                        console.warn(
                            `No se pudo cargar ${config.modelPath}, usando modelo de respaldo.`,
                            error
                        );

                        const respaldo = crearModeloRespaldo(config.nombre);
                        modelGroup.add(respaldo);
                        objetosAnimados.push(respaldo);

                    }

                );

            } else {

                const respaldo = crearModeloRespaldo(config.nombre);
                modelGroup.add(respaldo);
                objetosAnimados.push(respaldo);

            }

            // -------------------------------------------------
            // 4) EVENTOS DE DETECCIÓN — por cada target
            // -------------------------------------------------

            anchor.onTargetFound = () => {

                statusText.innerText = `¡${config.nombre} detectado!`;
                statusHint.innerText = "Modelo AR activo";

                statusDot.style.background = "#00ff88";
                statusDot.style.boxShadow = "0 0 10px #00ff88";

                instructions.style.opacity = "0";

            };

            anchor.onTargetLost = () => {

                statusText.innerText = "Buscando logo...";
                statusHint.innerText = "Apunta al logo del equipo";

                statusDot.style.background = "";
                statusDot.style.boxShadow = "";

                instructions.style.opacity = "1";

            };

        });

        // -------------------------------------------------
        // 6) BOTONES: CONFETI, FOTO Y PAUSAR
        // -------------------------------------------------

        function lanzarConfeti() {

            const colores = ["#36a5ff", "#feca57", "#4ecdc4", "#ffffff", "#ff6b6b"];
            const phone = document.querySelector(".phone.ar");

            for (let i = 0; i < 45; i++) {

                const pieza = document.createElement("div");
                pieza.className = "confetti-piece";
                pieza.style.left = Math.random() * 100 + "%";
                pieza.style.background =
                    colores[Math.floor(Math.random() * colores.length)];
                pieza.style.animationDuration = (2 + Math.random() * 1.5) + "s";

                phone.appendChild(pieza);

                setTimeout(() => pieza.remove(), 3600);

            }

        }

        document.getElementById("confettiBtn")
            .addEventListener("click", lanzarConfeti);

        // -------------------------------------------------
        // GALERÍA: guarda la foto AR para que galeria.html
        // la pueda leer y mostrar (usa localStorage, que es
        // compartido entre páginas del mismo sitio).
        // -------------------------------------------------

        const CLAVE_GALERIA = "arPhotos";
        const MAX_FOTOS_GUARDADAS = 12; // evita llenar el almacenamiento

        function guardarFotoEnGaleria(dataUrl) {

            try {

                const fotos = JSON.parse(localStorage.getItem(CLAVE_GALERIA) || "[]");

                fotos.unshift({
                    src: dataUrl,
                    fecha: new Date().toISOString(),
                    titulo: "Foto AR"
                });

                while (fotos.length > MAX_FOTOS_GUARDADAS) {
                    fotos.pop();
                }

                localStorage.setItem(CLAVE_GALERIA, JSON.stringify(fotos));
                return true;

            } catch (error) {

                console.error("No se pudo guardar la foto en la galería:", error);
                return false;

            }

        }

        const photoToast = document.getElementById("photoToast");
        let photoToastTimer = null;

        function mostrarAvisoFoto(mensaje, esError = false) {

            photoToast.textContent = mensaje;
            photoToast.classList.toggle("error", esError);
            photoToast.classList.add("show");

            clearTimeout(photoToastTimer);
            photoToastTimer = setTimeout(() => {
                photoToast.classList.remove("show");
            }, 2200);

        }

        // Dibuja el <video> de la cámara dentro del canvas destino,
        // recortando como "cover" (igual que hace el CSS con la cámara
        // en pantalla) para que no se vea deformado.
        function dibujarVideoComoCover(ctx, video, destW, destH) {

            const videoW = video.videoWidth;
            const videoH = video.videoHeight;

            if (!videoW || !videoH) return false;

            const relacionVideo = videoW / videoH;
            const relacionDestino = destW / destH;

            let sx, sy, sw, sh;

            if (relacionVideo > relacionDestino) {
                sh = videoH;
                sw = videoH * relacionDestino;
                sx = (videoW - sw) / 2;
                sy = 0;
            } else {
                sw = videoW;
                sh = videoW / relacionDestino;
                sx = 0;
                sy = (videoH - sh) / 2;
            }

            ctx.drawImage(video, sx, sy, sw, sh, 0, 0, destW, destH);
            return true;

        }

        // El confeti son <div> normales animados con CSS, no forman
        // parte del canvas 3D, así que hay que "dibujarlos" a mano
        // en la posición y color exactos en que están en ese instante.
        function dibujarConfetiActivo(ctx, destW, destH) {

            const phone = document.querySelector(".phone.ar");
            const phoneRect = phone.getBoundingClientRect();
            const piezas = phone.querySelectorAll(".confetti-piece");

            piezas.forEach((pieza) => {

                const rect = pieza.getBoundingClientRect();
                const estilo = getComputedStyle(pieza);

                const x = ((rect.left - phoneRect.left) / phoneRect.width) * destW;
                const y = ((rect.top - phoneRect.top) / phoneRect.height) * destH;
                const w = (rect.width / phoneRect.width) * destW;
                const h = (rect.height / phoneRect.height) * destH;

                let angulo = 0;

                try {
                    const matriz = new DOMMatrixReadOnly(estilo.transform);
                    angulo = Math.atan2(matriz.b, matriz.a);
                } catch (error) {
                    angulo = 0;
                }

                ctx.save();
                ctx.translate(x + w / 2, y + h / 2);
                ctx.rotate(angulo);
                ctx.fillStyle = estilo.backgroundColor || "#ffffff";
                ctx.fillRect(-w / 2, -h / 2, w, h);
                ctx.restore();

            });

        }

        document.getElementById("cameraBtn")
            .addEventListener("click", () => {

                // Fuerza un render justo antes de capturar: si no se
                // hace esto, el navegador puede haber limpiado el
                // buffer de WebGL y la captura sale en blanco.
                renderer.render(scene, camera);

                const modeloCanvas = renderer.domElement;
                const video = container.querySelector("video");

                const maxAncho = 480;
                const escala = Math.min(1, maxAncho / modeloCanvas.width);

                const temp = document.createElement("canvas");
                temp.width = Math.round(modeloCanvas.width * escala);
                temp.height = Math.round(modeloCanvas.height * escala);

                const ctx = temp.getContext("2d");

                // 1) Fondo: la imagen de la cámara en ese instante
                const huboVideo = video &&
                    dibujarVideoComoCover(ctx, video, temp.width, temp.height);

                if (!huboVideo) {
                    ctx.fillStyle = "#03101c";
                    ctx.fillRect(0, 0, temp.width, temp.height);
                }

                // 2) Encima: el canvas 3D con el modelo (respeta su
                //    transparencia, así solo se pinta donde hay modelo)
                ctx.drawImage(modeloCanvas, 0, 0, temp.width, temp.height);

                // 3) Encima: el confeti que esté cayendo en ese momento
                dibujarConfetiActivo(ctx, temp.width, temp.height);

                const dataUrl = temp.toDataURL("image/jpeg", 0.9);
                const guardado = guardarFotoEnGaleria(dataUrl);

                mostrarAvisoFoto(
                    guardado ? "📸 Foto guardada en la galería" : "No se pudo guardar la foto",
                    !guardado
                );

            });

        let pausado = false;
        const pauseBtn = document.getElementById("pauseBtn");

        pauseBtn.addEventListener("click", () => {

            pausado = !pausado;

            if (pausado) {
                mindarThree.pause();
            } else {
                mindarThree.unpause();
            }

            pauseBtn.classList.toggle("is-paused", pausado);
            pauseBtn.querySelector(".ar-icon").textContent = pausado ? "▶️" : "⏸️";
            pauseBtn.querySelector(".ar-label").textContent = pausado ? "Reanudar" : "Pausar";

        });

        // -------------------------------------------------
        // 7) INICIO: SOLICITA CÁMARA Y ARRANCA EL TRACKING
        // -------------------------------------------------

        let animando = false;
        let tiempo = 0;

        // MindAR calcula el tamaño del <video> y del <canvas> por su
        // cuenta (a veces deja franjas vacías si el aspect ratio de la
        // cámara no coincide con el del contenedor). Esto los fuerza a
        // cubrir siempre el 100% del contenedor, recortando lo que
        // sobre — igual que object-fit: cover.
        function forzarVideoCompleto() {

            const video = container.querySelector("video");
            const canvases = container.querySelectorAll("canvas");

            [video, ...canvases].forEach((el) => {

                if (!el) return;

                el.style.setProperty("position", "absolute", "important");
                el.style.setProperty("top", "0", "important");
                el.style.setProperty("left", "0", "important");
                el.style.setProperty("width", "100%", "important");
                el.style.setProperty("height", "100%", "important");
                el.style.setProperty("object-fit", "cover", "important");
                el.style.setProperty("margin", "0", "important");
                el.style.setProperty("transform", "none", "important");

            });

        }

        async function iniciarAR() {

            permissionOverlay.style.display = "none";
            statusText.innerText = "Solicitando cámara...";

            try {

                await mindarThree.start();

                forzarVideoCompleto();

                statusText.innerText = "Buscando logo...";
                statusHint.innerText = "Apunta al logo del equipo";

                if (!animando) {

                    animando = true;

                    renderer.setAnimationLoop(() => {

                        if (!pausado) {

                            tiempo += 0.02;

                            // Gira cada modelo AR sobre su propio eje
                            gruposModelo.forEach((grupo) => {
                                grupo.rotation.y += grupo.userData.rotationSpeed;
                            });

                            // Anima cualquier modelo de respaldo activo
                            // (los .glb propios se animan solos si traen
                            // sus propias animaciones/clips)
                            objetosAnimados.forEach((obj) => {
                                if (obj.userData.animar) obj.userData.animar(tiempo);
                            });

                        }

                        renderer.render(scene, camera);

                    });

                }

            } catch (error) {

                console.error("No se pudo iniciar la cámara:", error);

                statusText.innerText = "Cámara no disponible";
                statusHint.innerText = "Revisa los permisos";

                permissionText.innerText =
                    "No se pudo acceder a la cámara. Revisa los permisos " +
                    "del navegador y vuelve a intentarlo.";

                permissionOverlay.style.display = "flex";

            }

        }

        document.getElementById("enableCameraBtn")
            .addEventListener("click", iniciarAR);

        // MindAR recalcula el tamaño del video al rotar el celular o
        // redimensionar la ventana, así que lo volvemos a forzar
        // un instante después de que eso pase.
        window.addEventListener("resize", () => {
            setTimeout(forzarVideoCompleto, 300);
        });
        window.addEventListener("orientationchange", () => {
            setTimeout(forzarVideoCompleto, 300);
        });

        // Detener la cámara al salir de la vista, para no dejarla encendida
        window.addEventListener("beforeunload", () => {
            try { mindarThree.stop(); } catch (e) {}
        });

        // Intentar arrancar automáticamente al cargar la página
        iniciarAR();


    </script>
