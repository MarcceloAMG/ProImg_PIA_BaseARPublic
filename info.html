<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaseAR - Información</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="phone info">
        <div class="info-header">
            <!-- Ahora vuelve a equipos.html -->
            <button class="back" onclick="location.href='equipos.html'">‹</button>
            <h2>Información</h2>
        </div>

        <div class="team-header">
            <div class="team-logo" id="teamLogo">⚾</div>
            <div class="team-data">
                <h1 id="teamName">Cargando...</h1>
                <p id="teamCity">📍 Cargando...</p>
            </div>
        </div>

        <div class="info-menu">
            <button class="info-option trivia" id="btnTrivia">
                <div class="option-icon">🧠</div>
                <div class="option-text">
                    <strong>Trivia</strong>
                    <span>5 preguntas</span>
                </div>
                <div class="arrow">›</div>
            </button>

            <button class="info-option" onclick="location.href='video.html'">
                <div class="option-icon">🎥</div>
                <div class="option-text">
                    <strong>Video</strong>
                    <span>Filtros y contenido</span>
                </div>
                <div class="arrow">›</div>
            </button>

            <button class="info-option" id="btnStats">
                <div class="option-icon">📊</div>
                <div class="option-text">
                    <strong>Estadísticas</strong>
                    <span>Datos del equipo</span>
                </div>
                <div class="arrow">›</div>
            </button>

            <button class="info-option" onclick="location.href='juego.html'">
                <div class="option-icon">🎮</div>
                <div class="option-text">
                    <strong>Juego</strong>
                    <span>Gana un premio</span>
                </div>
                <div class="arrow">›</div>
            </button>

            <button class="info-option" onclick="location.href='historia-baseball.html'">
                <div class="option-icon">📖</div>
                <div class="option-text">
                    <strong>Historia del béisbol</strong>
                    <span>Conoce el origen del deporte</span>
                </div>
                <div class="arrow">›</div>
            </button>

            <button class="info-option" id="btnHistory">
                <div class="option-icon">🏆</div>
                <div class="option-text">
                    <strong>Historia del equipo</strong>
                    <span>Conoce su trayectoria</span>
                </div>
                <div class="arrow">›</div>
            </button>

            <button class="info-option" onclick="location.href='galeria.html'">
                <div class="option-icon">🖼️</div>
                <div class="option-text">
                    <strong>Galería</strong>
                    <span>Fotos y contenido multimedia</span>
                </div>
                <div class="arrow">›</div>
            </button>
        </div>

        <button class="button" onclick="location.href='ar.html'">📷 VOLVER AL AR</button>
    </div>

     <!-- CARGAMOS LOS DATOS Y LA LÓGICA -->
    <script src="js/teams-data.js"></script>
    <script>
        window.onload = function() {
            // 1. Verificamos si el archivo de datos cargó
            if (typeof TEAMS_DATA === 'undefined') {
                document.getElementById('teamName').innerText = "Error de Datos";
                document.getElementById('teamCity').innerText = "Revisa que js/teams-data.js exista";
                alert("No se encontró el archivo js/teams-data.js. Revisa la ruta.");
                return;
            }

            // 2. Obtener el equipo de la URL (ej. info.html?team=yankees)
            const urlParams = new URLSearchParams(window.location.search);
            const teamId = urlParams.get('team') || 'yankees';

            // 3. Buscar los datos
            const teamData = TEAMS_DATA[teamId];

            // 4. Actualizar el HTML
            if (teamData) {
                document.getElementById('teamLogo').innerText = teamData.logo || '⚾';
                document.getElementById('teamName').innerText = teamData.name;
                document.getElementById('teamCity').innerText = '📍 ' + teamData.city;
                document.title = 'BaseAR - ' + teamData.name;

                // 5. Activar los botones dinámicos
                document.getElementById('btnTrivia').onclick = function() {
                    location.href = `trivia.html?team=${teamId}`;
                };
                document.getElementById('btnStats').onclick = function() {
                    location.href = `estadisticas.html?team=${teamId}`;
                };
                document.getElementById('btnHistory').onclick = function() {
                    location.href = `historia-equipo.html?team=${teamId}`;
                };
            } else {
                document.getElementById('teamName').innerText = "Equipo no encontrado";
                document.getElementById('teamCity').innerText = "El ID " + teamId + " no existe.";
            }
        };
    </script>
</body>
</html>
